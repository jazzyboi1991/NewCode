[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodthink"
version = "0.2.0"
description = "Python reference interpreter for the Newcode language"
requires-python = ">=3.11"

[project.scripts]
goodthink = "newcode.cli:main"

[tool.setuptools]
packages = ["newcode", "goodthink"]
